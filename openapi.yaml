      "security": []
      "responses":
        "200":
          "description": "Success."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Readiness"
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "409":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "415":
          "$ref": "#/components/responses/Error"
        "429":
          "$ref": "#/components/responses/Error"
        "500":
          "$ref": "#/components/responses/Error"
        "503":
          "description": "Readiness unavailable."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/Unavailable"
        "504":
          "$ref": "#/components/responses/Error"
      "servers":
        -
          "url": "http://localhost:3001"
"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
      "description": "15-minute access JWT backed by a current live account/session."
    "registrationBearer":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
      "description": "Single-use five-minute registration JWT from NEW_USER login. Only /auth/register accepts it."
  "schemas":
